<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">AI 協作工作流</title><desc id="d">人類需求方提出方向，GPT-6 轉譯規格，Codex 實作，人類驗收並回饋形成下一輪</desc><rect width="1200" height="340" rx="26" fill="#f3e8d5"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="52" y="61" font-size="28" font-weight="700" fill="#453b31">三方協作，循環驗收</text><text x="53" y="92" font-size="17" fill="#786958">每次只解決一個明確問題</text><g><rect x="55" y="130" width="300" height="115" rx="17" fill="#fffaf0" stroke="#c7b597" stroke-width="2"/><text x="84" y="171" font-size="25" font-weight="700" fill="#3e5547">人類需求方</text><text x="84" y="205" font-size="18" fill="#675746">提出需求・實際驗收</text></g><g><rect x="452" y="130" width="300" height="115" rx="17" fill="#fffaf0" stroke="#c7b597" stroke-width="2"/><text x="480" y="171" font-size="25" font-weight="700" fill="#3e5547">GPT-6</text><text x="480" y="205" font-size="18" fill="#675746">釐清問題・整理規格</text></g><g><rect x="846" y="130" width="300" height="115" rx="17" fill="#fffaf0" stroke="#c7b597" stroke-width="2"/><text x="874" y="171" font-size="25" font-weight="700" fill="#3e5547">Codex</text><text x="874" y="205" font-size="18" fill="#675746">實作程式・回報測試</text></g><g fill="none" stroke="#6a805d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M369 187 H437"/><path d="M424 174 L437 187 L424 200"/><path d="M766 187 H832"/><path d="M819 174 L832 187 L819 200"/><path d="M995 259 V286 H204 V259"/></g><text x="600" y="280" fill="#6c675b" font-size="16" text-anchor="middle">試用、截圖、修正與下一輪</text></g></svg>